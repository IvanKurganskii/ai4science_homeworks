# Онтология проекта — шаблон. Скопируйте в корень проекта как ontology.yaml и замените <…>.
# Образец заполнения — demo_graph/ontology.yaml. Проверка: python3 check_week4.py

ontology: <короткое имя проекта>
goal: >
  <Одна-две фразы: на какие вопросы должен отвечать граф проекта и кто им пользуется —
  исследователь, агент, рецензент.>

# Компетентностные вопросы: 3–5. Каждый класс и каждое отношение нужны хотя бы одному.
competency_questions:
  - <Вопрос 1 на естественном языке>
  - <Вопрос 2>
  - <Вопрос 3>

# Классы — множества объектов. Имя — существительное в единственном числе, без пробелов.
# parent — надкласс (null для верхних классов); definition — признак, по которому объект
# попадает в класс. Экземпляры (конкретная серия, конкретная статья) сюда не пишутся.
classes:
  ИнформационныйОбъект:
    parent: null
    definition: объект, который несёт сведения — задача, утверждение, данные, метод, текст
  Процесс:
    parent: null
    definition: то, что происходит во времени — опыт, расчёт, проверка
  Файл:
    parent: null
    definition: файл проекта — таблица, код, текст, источник; узел графа — сам файл, заметка о нём не нужна
  Задача:
    parent: ИнформационныйОбъект
    definition: поручение пользователя или его часть; заметки задач в tasks/ ведёт агент
  Утверждение:
    parent: ИнформационныйОбъект
    definition: высказывание, которое может оказаться истинным или ложным
  Гипотеза:
    parent: Утверждение
    definition: утверждение, которое проверяют в эксперименте
  Результат:
    parent: Утверждение
    definition: утверждение, полученное в эксперименте, с числом и условиями
  НаборДанных:
    parent: ИнформационныйОбъект
    definition: таблица или серия измерений
  Метод:
    parent: ИнформационныйОбъект
    definition: способ обработки данных или постановки опыта
  Источник:
    parent: ИнформационныйОбъект
    definition: опубликованная работа, на которую ссылаются; текст — в library/
  Ограничение:
    parent: ИнформационныйОбъект
    definition: известный дефект данных или условие применимости
  Отчёт:
    parent: ИнформационныйОбъект
    definition: текст об исследовании для читателя; заметка отчёта — сам файл в reports/
  Эксперимент:
    parent: Процесс
    definition: опыт или расчёт, который проверяет гипотезу
  Проверка:
    parent: Процесс
    definition: независимая проверка результата другим способом
  Программа:
    parent: Файл
    definition: набор инструкций, которые компьютер выполняет для решения определённой задачи
  Модель:
    parent: ИнформационныйОбъект
    definition: математическое описание физической системы, основанное на выбранных законах и допущениях и позволяющее исследовать и предсказывать её поведение с помощью численных расчётов
  МатематическийОбъект:
    parent: ИнформационныйОбъект
    definition: абстрактная сущность, определяемая математическими свойствами и отношениями
  Оператор:
    parent: Функция
    definition: функция, задающая линейное преобразование векторов состоянийй
  Гамильтониан:
    parent: Оператор
    definition: оператор полной энергии квантовой системы, задающий её временную эволюцию
  СпиновыйГамильтониан:
    parent: Гамильтониан
    definition: гамильтониан, выраженный через операторы спина и описывающий энергию спиновых степеней свободы системы
  ФизическаяВеличина:
    parent: ИнформационныйОбъект
    definition: количественная характеристика физической системы, её состояния или процесса
  МоментИмпульса:
    parent: ФизическаяВеличина
    definition: векторная величина, характеризующая вращательные свойства системы
  Спин:
    parent: МоментИмпульса
    definition: собственный момент импульса квантовой системы
  Скаляр:
    parent: МатематическийОбъект
    definition: числовой элемент поля, над которым задано векторное пространство
  Вектор:
    parent: МатематическийОбъект
    definition: элемент векторного пространства
  Функция:
    parent: МатематическийОбъект
    definition: отображение, сопоставляющее каждому аргументу единственное значение
  ВекторСостояния:
    parent: Вектор
    definition: ненулевой вектор гильбертова пространства, представляющий чистое квантовое состояние
  СобственныйВектор:
    parent: Вектор
    definition: ненулевой вектор, который оператор преобразует в тот же вектор, умноженный на скаляр
  СобственноеЗначение:
    parent: Скаляр
    definition: коэффициент, на который оператор умножает соответствующий собственный вектор
  СобственнаяПара:
    parent: МатематическийОбъект
    definition: пара собственного значения и соответствующего собственного вектора заданного оператора
  Состояние:
    parent: ИнформационныйОбъект
    definition: описание системы в заданный момент времени в рамках выбранной модели
  КвантовоеСостояние:
    parent: Состояние
    definition: состояние, определяющее вероятности результатов квантовых измерений
  Эволюция:
    parent: Процесс
    definition: изменение состояния системы во времени
  КвантоваяЭволюция:
    parent: Эволюция
    definition: изменение квантового состояния системы во времени
  УнитарнаяЭволюция:
    parent: КвантоваяЭволюция
    definition: квантовая эволюция, описываемая унитарным преобразованием состояния
  МатематическоеСоотношение:
    parent: МатематическийОбъект
    definition: формальная запись связи между математическими выражениями
  Уравнение:
    parent: МатематическоеСоотношение
    definition: равенство математических выражений, содержащее неизвестные
  ЧистоеКвантовоеСостояние:
    parent: КвантовоеСостояние
    definition: квантовое состояние, представимое одним вектором состояния
  СмешанноеКвантовоеСостояние:
    parent: КвантовоеСостояние
    definition: квантовое состояние, описываемое статистической смесью чистых состояний и не представимое одним вектором состояния
  СобственноеСостояниеЭнергии:
    parent: ЧистоеКвантовоеСостояние
    definition: состояние с определённой энергией, представленное собственным вектором гамильтониана
  ВолноваяФункция:
    parent: Функция
    definition: функция амплитуд вероятности, представляющая чистое квантовое состояние в выбранном базисе
  СпиноваяВолноваяФункция:
    parent: ВолноваяФункция
    definition: волновая функция спиновых степеней свободы в выбранном спиновом базисе
  ОператорПлотности:
    parent: Оператор
    definition: положительный оператор с единичным следом, представляющий чистое или смешанное квантовое состояние
  ОператорСпина:
    parent: Оператор
    definition: оператор компоненты спина или квадрата его модуля
  Энергия:
    parent: ФизическаяВеличина
    definition: физическая величина, представленная гамильтонианом в квантовой механике
  УровеньЭнергии:
    parent: СобственноеЗначение
    definition: допустимое дискретное значение энергии системы, определяемое собственным значением гамильтониана
  Вероятность:
    parent: Скаляр
    definition: вещественное число от нуля до единицы, характеризующее возможность события
  НаселённостьУровняЭнергии:
    parent: Вероятность
    definition: вероятность обнаружить систему на заданном уровне энергии в заданном квантовом состоянии
  ПараметрМодели:
    parent: ИнформационныйОбъект
    definition: величина, значение которой задаёт конкретный вариант модели или её компонента
  ПараметрРНП:
    parent: ПараметрМодели
    definition: параметр квадратичного спинового гамильтониана расщепления в нулевом поле
  АксиальныйПараметрРНП:
    parent: ПараметрРНП
    definition: параметр D, задающий аксиальную составляющую расщепления в нулевом поле
  РомбическийПараметрРНП:
    parent: ПараметрРНП
    definition: параметр E, задающий ромбическую составляющую расщепления в нулевом поле
  ФизическоеЯвление:
    parent: null
    definition: проявление физических закономерностей в свойствах или поведении системы
  РасщеплениеВНулевомПоле:
    parent: ФизическоеЯвление
    definition: разделение энергий спиновых подуровней при отсутствии внешнего магнитного поля вследствие анизотропных взаимодействий
  СлагаемоеГамильтониана:
    parent: Оператор
    definition: оператор, входящий слагаемым в гамильтониан системы
  СлагаемоеРНП:
    parent: СлагаемоеГамильтониана
    definition: слагаемое гамильтониана, описывающее расщепление в нулевом поле
  Источник:
    parent: ИнформационныйОбъект
    definition: опубликованная работа, на которую ссылаются; текст — в library/
  Автор:
    parent: null
    definition: человек — автор опубликованной работы
  ЗапросКГрафу:
    parent: Процесс
    definition: обращение к внешнему графу знаний — источник, инструмент и аргументы, дата, число найденных записей

    
properties:
  подзадачаОт:   {domain: Задача, range: Задача, characteristics: [транзитивное]}
  решает:        {domain: [Эксперимент, Проверка], range: Задача}
  выполняет:     {domain: Отчёт, range: Задача}
  проверяет:     {domain: Эксперимент, range: Гипотеза}
  использует:    {domain: Эксперимент, range: НаборДанных}
  применяет:     {domain: Эксперимент, range: Метод}
  даёт:          {domain: Эксперимент, range: Результат}
  подтверждает:  {domain: Результат, range: Гипотеза}
  опровергает:   {domain: Результат, range: Гипотеза}
  проверенЧерез: {domain: Результат, range: Проверка}
  ограничивает:  {domain: Ограничение, range: [НаборДанных, Результат]}
  основанаНа:    {domain: [Гипотеза, Метод], range: Источник}
  ссылаетсяНа:   {domain: Отчёт, range: Источник}
  хранитсяВ:     {domain: [НаборДанных, Результат, Источник], range: Файл}
  реализованВ:   {domain: [Эксперимент, Проверка], range: Файл}
  входитВ:      {domain: ИнформационныйОбъект, range: ИнформационныйОбъект, characteristics: [транзитивное]}
  содержит:     {domain: ИнформационныйОбъект, range: ИнформационныйОбъект, characteristics: [транзитивное]}
  представляет: {domain: МатематическийОбъект, range: ИнформационныйОбъект}
  описывает:    {domain: ИнформационныйОбъект, range: [ИнформационныйОбъект, Процесс, ФизическоеЯвление]}
  характеризует: {domain: ИнформационныйОбъект, range: [ИнформационныйОбъект, ФизическоеЯвление]}
  соответствует: {domain: ИнформационныйОбъект, range: ИнформационныйОбъект}
  заданДля:     {domain: ИнформационныйОбъект, range: ИнформационныйОбъект}
  удовлетворяет: {domain: МатематическийОбъект, range: МатематическоеСоотношение}
  действуетНа:  {domain: Оператор, range: Вектор}
  вход:         {domain: Процесс, range: ИнформационныйОбъект}
  выход:        {domain: Процесс, range: ИнформационныйОбъект}
  вычисленИз:   {domain: ИнформационныйОбъект, range: ИнформационныйОбъект}
  найденЗапросом: {domain: Источник, range: ЗапросКГрафу}
  написан:        {domain: Источник, range: Автор}
  цитирует:       {domain: Источник, range: Источник}
  
  

# Атрибуты — свойства со значением из списка (в заметке — поле в начале файла).
attributes:
  status:
    domain: Задача
    values: [открыта, в работе, выполнена, заблокирована, принята]
  oa_status:
    domain: Источник
    values: [diamond, gold, hybrid, green, bronze, closed]

rules:
  - id: П1
    text: Каждый эксперимент проверяет хотя бы одну гипотезу.
    dl: "Эксперимент ⊑ ∃проверяет.Гипотеза"
    check: {kind: some, class: Эксперимент, property: проверяет, target: Гипотеза}
  - id: П2
    text: Каждый результат получен в каком-то эксперименте.
    dl: "Результат ⊑ ∃даёт⁻.Эксперимент"
    check: {kind: some_inverse, class: Результат, property: даёт, source: Эксперимент}
  - id: П3
    text: Принятый результат — результат, прошедший хотя бы одну проверку.
    dl: "ПринятыйРезультат ≡ Результат ⊓ ∃проверенЧерез.Проверка"
    check: {kind: defined, name: ПринятыйРезультат, class: Результат, property: проверенЧерез, target: Проверка}
  - id: П4
    text: Результат не может одновременно подтверждать и опровергать одну гипотезу.
    dl: "DisjointObjectProperties(подтверждает опровергает)"
    check: {kind: disjoint_properties, properties: [подтверждает, опровергает]}
  - id: П5
    text: Каждый набор данных указывает на файл, в котором лежит.
    dl: "НаборДанных ⊑ ∃хранитсяВ.Файл"
    check: {kind: some, class: НаборДанных, property: хранитсяВ, target: Файл}
  - id: П6
    text: Каждый отчёт ссылается хотя бы на один источник.
    dl: "Отчёт ⊑ ∃ссылаетсяНа.Источник"
    check: {kind: some, class: Отчёт, property: ссылаетсяНа, target: Источник}
  - id: П7
    text: Выполненная задача — задача со статусом «выполнена» или «принята».
    dl: "ВыполненнаяЗадача ≡ Задача ⊓ ∃status.{выполнена, принята}"
    check: {kind: defined_value, name: ВыполненнаяЗадача, class: Задача, attribute: status, values: [выполнена, принята]}
  - id: П8
    text: Выполненную задачу закрывает эксперимент, проверка или отчёт либо у неё есть подзадачи.
    dl: "ВыполненнаяЗадача ⊑ ∃решает⁻.⊤ ⊔ ∃выполняет⁻.⊤ ⊔ ∃подзадачаОт⁻.⊤"
    check: {kind: some_inverse_any, class: ВыполненнаяЗадача, properties: [решает, выполняет, подзадачаОт]}
  - id: П9
    text: Задача выполнена, только если выполнены все её подзадачи.
    dl: "ВыполненнаяЗадача ⊑ ∀подзадачаОт⁻.ВыполненнаяЗадача"
    check: {kind: all_inverse, class: ВыполненнаяЗадача, property: подзадачаОт, source: ВыполненнаяЗадача}
  - id: П10
    text: В заметке выполненной задачи есть раздел «Итог» — что сделано и чем проверено.
    dl: "— (правило оформления, проверяется по тексту заметки)"
    check: {kind: section, class: ВыполненнаяЗадача, section: Итог}

# Правила с check используют виды проверок, уже встречающиеся в П1–П10.
# Правила без check задают логические или числовые требования;
# их выполнение не подтверждается одной лишь проверкой наличия связей графа.
  - id: П11
    text: "Отношения входитВ и содержит взаимно обратны и обозначают состав, а не принадлежность классу."
    dl: "InverseObjectProperties(входитВ содержит)"
  - id: П12
    text: "Чистое и смешанное квантовые состояния — непересекающиеся классы."
    dl: "DisjointClasses(ЧистоеКвантовоеСостояние СмешанноеКвантовоеСостояние)"
  - id: П13
    text: "Каждое квантовое состояние является чистым или смешанным."
    dl: "КвантовоеСостояние ⊑ ЧистоеКвантовоеСостояние ⊔ СмешанноеКвантовоеСостояние"
  - id: П14
    text: "Каждый вектор состояния представляет хотя бы одно чистое квантовое состояние."
    dl: "ВекторСостояния ⊑ ∃представляет.ЧистоеКвантовоеСостояние"
    check: {kind: some, class: ВекторСостояния, property: представляет, target: ЧистоеКвантовоеСостояние}
  - id: П15
    text: "Каждая волновая функция представляет хотя бы одно чистое квантовое состояние."
    dl: "ВолноваяФункция ⊑ ∃представляет.ЧистоеКвантовоеСостояние"
    check: {kind: some, class: ВолноваяФункция, property: представляет, target: ЧистоеКвантовоеСостояние}
  - id: П16
    text: "Каждый оператор плотности представляет хотя бы одно квантовое состояние."
    dl: "ОператорПлотности ⊑ ∃представляет.КвантовоеСостояние"
    check: {kind: some, class: ОператорПлотности, property: представляет, target: КвантовоеСостояние}
  - id: П17
    text: "Каждый оператор спина представляет соответствующую величину спина."
    dl: "ОператорСпина ⊑ ∃представляет.Спин"
    check: {kind: some, class: ОператорСпина, property: представляет, target: Спин}
  - id: П18
    text: "Каждый гамильтониан представляет энергию рассматриваемой системы."
    dl: "Гамильтониан ⊑ ∃представляет.Энергия"
    check: {kind: some, class: Гамильтониан, property: представляет, target: Энергия}
  - id: П19
    text: "Каждая собственная пара задана для оператора."
    dl: "СобственнаяПара ⊑ ∃заданДля.Оператор"
    check: {kind: some, class: СобственнаяПара, property: заданДля, target: Оператор}
  - id: П20
    text: "Каждая собственная пара содержит собственный вектор."
    dl: "СобственнаяПара ⊑ ∃содержит.СобственныйВектор"
    check: {kind: some, class: СобственнаяПара, property: содержит, target: СобственныйВектор}
  - id: П21
    text: "Каждой собственной паре соответствует собственное значение."
    dl: "СобственнаяПара ⊑ ∃соответствует.СобственноеЗначение"
    check: {kind: some, class: СобственнаяПара, property: соответствует, target: СобственноеЗначение}
  - id: П22
    text: "Каждая собственная пара удовлетворяет уравнению своего оператора."
    dl: "СобственнаяПара ⊑ ∃удовлетворяет.Уравнение"
