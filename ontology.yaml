  - id: П44
    text: "Для унитарной эволюции от t0 до t1 выполняются U†U = UU† = I и ρ(t1) = U ρ(t0) U†; для нормированного вектора чистого состояния ψ(t1) = U ψ(t0). Преобразование U согласовано с описывающим эволюцию гамильтонианом."
    dl: "— (проверка преобразования состояния и его согласованности с гамильтонианом)"
  - id: П45
    text: "При квадратичном описании РНП в главных осях H_РНП = D[S_z² − S(S+1)I/3] + E[S_x² − S_y²]. При безразмерных операторах спина D и E заданы в единицах энергии; при записи H_РНП/h — в единицах частоты; в ЭПР-спектроскопии могут быть заданы через единицы магнитного поля H_РНП/g\beta. Соглашение об осях сохраняется вместе с параметрами; перестановка x и y меняет знак E."
    dl: "— (проверка соглашения, единиц и математических данных слагаемого РНП)"
