  - id: П42
    text: "Оператор плотности положителен и имеет единичный след. Для чистого состояния ρ² = ρ; для смешанного состояния Tr(ρ²) меньше единицы. Оператор плотности определяется на том же пространстве, что и соответствующее состояние."
    dl: "— (проверка математических данных оператора плотности)"
  - id: П43
    text: "Гамильтониан самосопряжён на своей области определения; в конечномерном матричном представлении H† = H."
